[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "powerscaler"
version = "0.1.0"
description = "Evidence-in power scaling analysis assistant"
requires-python = ">=3.10"

[project.scripts]
powerscaler = "powerscaler.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
